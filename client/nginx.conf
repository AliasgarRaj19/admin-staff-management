server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 301 /admin-staff/;
  }

  location /admin-staff/ {
    try_files $uri $uri/ /admin-staff/index.html;
  }

  location /admin-staff/assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
